name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # every platform still has to compile on each push
  compile:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run build
      - run: cargo build --workspace --release

  # tag v* -> signed installers + latest.json for the in-app updater, as a draft release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compile
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sunucu Analiz - Foxivo ${{ github.ref_name }}
          releaseBody: 'Kurulum ve doğrulama adımları için README dosyasına bakın.'
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  checksums:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out && cd out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      # Sends each installer to VirusTotal and collects the result pages.
      # Skipped when the VT_API_KEY secret isn't set.
      - env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "VT_API_KEY not set, skipping"; exit 0; fi
          cd out
          for f in *.exe *.dmg *.AppImage *.deb; do
            [ -f "$f" ] || continue
            # files over 32 MB need a one-off upload URL
            url="https://www.virustotal.com/api/v3/files"
            if [ "$(stat -c%s "$f")" -gt 33554432 ]; then
              url=$(curl -s -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            fi
            curl -s -o /dev/null -H "x-apikey: $VT_API_KEY" -F "file=@$f" "$url" || true
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            echo "  - [$f](https://www.virustotal.com/gui/file/$sum)" >> ../vt.md
          done

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" vt.md > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
